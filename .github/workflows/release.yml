name: Release

# Pushing a tag like v1.0.0 builds the addon and uploads it to CurseForge, Wago and GitHub Releases.
# Running the workflow manually only builds it and attaches the zip to the run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run tests
        run: |
          sudo apt-get install -yq lua5.1 > /dev/null
          lua5.1 tests/run.lua > /dev/null

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ github.event_name == 'workflow_dispatch' && '-d' || '' }}

      - name: Attach build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: DemonTrainerForever
          path: .release/*.zip
          include-hidden-files: true
